# Continuous integration for AnyCodec.
#
# The shape of this file follows one rule: **a job must exist for every platform
# whose code cannot be verified on a single development machine.** The Apple
# backend has never executed anywhere (there is no macOS media engine on the
# machine it was written on), the Linux backend needs GStreamer, and the Windows
# backend needs Media Foundation. Those three are exactly what the runners below
# provide, so this file is the only place those backends actually run.
#
# Two habits are encoded throughout, both paid for in an earlier release of a
# sibling package:
#
#   * **`shell: bash` on every step that runs a command.** The default shell on a
#     Windows runner is PowerShell, whose error handling turns a native program's
#     stderr into a terminating error (MSBuild writes progress to stderr, so it
#     aborted working builds) and whose file APIs default to the system code page
#     (which silently corrupted a UTF-8 source file). bash has neither problem.
#
#   * **The publish step does not trust its own exit code.**
#     `dart pub publish --dry-run` returns 65 for a *warning*, so a `set -e` on
#     it fails the build for something harmless and hides the real signal. The
#     assertions live in `.github/scripts/check_archive.dart`, which parses the
#     output instead.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Keep cargo's own parallelism from starving the test harness on 2-core runners.
  CARGO_BUILD_JOBS: 2

jobs:
  # ---------------------------------------------------------------------------
  # Fast, host-independent checks. No Rust build, so this reports in ~1 minute
  # and is the job worth making required.
  # ---------------------------------------------------------------------------
  dart-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter, not the bare Dart SDK: `pub` also resolves `example/`, which
      # depends on `flutter_test`, and that fails outright under a Dart-only SDK
      # with "flutter_test from sdk which doesn't exist".
      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      - name: Formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed lib test example/lib hook .github

      # `dart analyze` at the package root does NOT look at `hook/`, so the build
      # hook needs its own pass. It is compiled rather than analyzed by the SDK,
      # which is why a `hook/`-only error can survive a green root analyze.
      - name: Analyze (package)
        shell: bash
        run: dart analyze

      - name: Analyze (build hook)
        shell: bash
        run: dart analyze hook --fatal-warnings

      # .github/ is not reliably included by a bare dart analyze, and a broken
      # CI script is exactly the kind of thing that should not reach a runner.
      - name: Analyze (CI scripts)
        shell: bash
        run: dart analyze .github --fatal-warnings

      - name: Example analyzes
        shell: bash
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      # Editing a workflow is otherwise unverifiable without pushing it.
      - name: The workflows are well formed
        shell: bash
        run: dart run .github/scripts/validate_workflows.dart

      # The gate that would have caught a published-but-uncompilable package.
      - name: Would the published archive work?
        shell: bash
        run: dart run .github/scripts/check_archive.dart

  # ---------------------------------------------------------------------------
  # The Rust suite on every platform that has its own media framework. This is
  # where the Apple and Windows backends run for real.
  # ---------------------------------------------------------------------------
  rust-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
          rustup default 1.99.0

      # `~/.rustup` holds the toolchain *and* the twelve target std libraries
      # `rust-toolchain.toml` asks for; without this every job re-downloads them.
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-1.99.0-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # GStreamer is the Linux backend, and `gstreamer-rs` links it, so the crate
      # will not even compile without the dev packages. The plugins are what the
      # real round-trip tests need.
      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav
          pkg-config --modversion gstreamer-1.0

      - name: Formatting
        shell: bash
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Clippy
        shell: bash
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml

      # The `#[ignore]`d tests are the real end-to-end ones: an H.264 encode that
      # must produce packets, and a FLAC encode -> parse -> decode round trip.
      # They are ignored on developer machines that may have no plugins; on the
      # Linux runner they are the point.
      - name: Test the real codec round trips (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo test --manifest-path rust/Cargo.toml -- --ignored

  # ---------------------------------------------------------------------------
  # The Dart binding tests, on every platform. `dart test` builds the Rust
  # `cdylib` through the build hook, so a green run here means the hook, the code
  # asset, the asset id, struct layout and the whole FFI surface work on that OS.
  # ---------------------------------------------------------------------------
  dart-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0

      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: rustup-1.99.0-${{ runner.os }}-${{ hashFiles('rust/rust-toolchain.toml') }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install GStreamer (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav

      - name: Resolve dependencies
        shell: bash
        run: flutter pub get

      - name: Test
        shell: bash
        run: dart test --reporter expanded

  # ---------------------------------------------------------------------------
  # The targets that cannot be executed here at all, only type-checked. Needs no
  # SDK: the Android and Apple binding crates ship their own declarations, and
  # `cargo check` does not link.
  # ---------------------------------------------------------------------------
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain and the cross targets
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustup target add \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android \
            aarch64-apple-darwin x86_64-apple-darwin \
            aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Check every target that has no runner of its own
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios
          do
            echo "::group::cargo check --target $target"
            cargo check --manifest-path rust/Cargo.toml --target "$target" --all-targets
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # The dependency floor. pub.dev scores the package by resolving `pub downgrade`,
  # which pulls every dependency to its lowest allowed version — a set no
  # developer ever builds against, and therefore a set that breaks first. A
  # too-low `platform` bound once made ffigen's build hook fail to compile, and
  # the failure showed up only as `[pub-downgrade-failed]`, never as an analyzer
  # error, because build hooks are compiled rather than analyzed.
  # ---------------------------------------------------------------------------
  dependency-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve at the lower bounds
        shell: bash
        run: |
          flutter pub get
          dart pub downgrade --no-example

      - name: The package still analyzes
        shell: bash
        run: |
          dart analyze
          dart analyze hook --fatal-warnings

      # Compiling the hook outright is the check that catches a dependency whose
      # API the hook uses having been removed. Analysis does not cover it.
      - name: The build hook still compiles
        shell: bash
        run: dart compile kernel hook/build.dart -o /tmp/anycodec-hook.dill

      - name: Fail if the downgrade rewrote pubspec.yaml
        shell: bash
        run: |
          if ! git diff --quiet -- pubspec.yaml; then
            echo "::error::dart pub downgrade changed pubspec.yaml; a lower bound is wrong"
            git diff -- pubspec.yaml
            exit 1
          fi
