# cbindgen configuration for the AnyCodec C ABI.
#
# Regenerate the header with:
#   cd rust
#   cbindgen --config cbindgen.toml --crate anycodec --output include/anycodec.h
#
# The `include` filter is exact: only identifiers in the four namespaces below
# reach the header, so the safe Rust model in `crate::media` and `crate::engine`
# can never leak into the ABI by accident.
#   AnyCodec*   repr(C) structs, opaque handles and typedefs
#   anycodec_*  exported functions
#   ANYCODEC_*  numeric constants
#   STATUS_*    the i32 status codes returned by every function
language = "C"
include_guard = "ANYCODEC_H"
pragma_once = true
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify. */"
cpp_compat = true
documentation = true
documentation_style = "doxy"
line_length = 100
tab_width = 4
style = "both"

header = """
/*
 * AnyCodec - cross-platform audio/video codec engine.
 *
 * The ABI is deliberately flat:
 *
 *  - every object is an opaque handle owned by the caller and released with the
 *    matching `*_free` function;
 *  - no structure here owns memory you are allowed to free by hand;
 *  - every function returns `0` (or a positive "got output" code) on success and
 *    a negative `STATUS_*` code on failure;
 *  - the failure detail lives in a thread-local slot read with
 *    `anycodec_last_error_message()`.
 *
 * Whether an encode/decode landed on a software fallback is answered by
 * `anycodec_encoder_path()` / `anycodec_decoder_path()`: check
 * `AnyCodecCodecPath::is_software`.
 */
#include <stdarg.h>
#include <stdbool.h>
#include <stddef.h>
#include <stdint.h>
"""

[export]
include = ["AnyCodec", "anycodec_", "ANYCODEC_", "STATUS_", "PASSTHROUGH_"]
# The safe Rust model is deliberately not part of the ABI. cbindgen otherwise
# declares the crate's public enums as opaque structs; these explicit exclusions
# keep the header to exactly the ABI surface.
exclude = [
  "AudioCodec",
  "VideoCodec",
  "Codec",
  "CodecKind",
  "BackendKind",
  "BackendPreference",
  "Implementation",
  "CodecPath",
  "PixelFormat",
  "SampleFormat",
  "ChannelLayout",
  "Preset",
  "EncoderConfig",
  "DecoderConfig",
  "Frame",
  "Packet",
  "Buffer",
  "Error",
  "ErrorKind",
  "MediaKind",
  "Registry",
  "CapabilityReport",
  "BackendInfo",
  "HwDeviceInfo",
  "HwCodecSupport",
  "Encoder",
  "Decoder",
]
item_types = ["structs", "typedefs", "opaque", "functions", "constants"]

# Keep the parse local: AnyCodec is a single crate, and pulling in dependency
# crates would drag their types into the header.
[parse]
parse_deps = false
clean = false

[fn]
args = "horizontal"
rename_args = "snake_case"
must_use = "ANYCODEC_MUST_USE"

[defines]

[const]
allow_static_const = true
allow_constexpr = false
