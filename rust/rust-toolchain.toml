[toolchain]
# WARNING: an exact version (not `stable`/`beta`/`nightly`) is required by
# `native_toolchain_rust` so that every consumer builds byte-identical code.
channel = "1.99.0"

# Every target AnyCodec ships a dynamic library for.
targets = [
  # Android
  "armv7-linux-androideabi",
  "aarch64-linux-android",
  "x86_64-linux-android",
  # iOS (device + simulator)
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
  # macOS
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  # Windows
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  # Linux
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]
