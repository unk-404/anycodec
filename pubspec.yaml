# The AnyCodec workspace root.
#
# This is a **Dart pub workspace** (SDK 3.6+), not a package. It exists so that
# every project in the repository shares one dependency resolution, one
# `pubspec.lock` and one `.dart_tool/` — which is what makes "the packages all
# build against the same versions" a fact rather than a hope. It is never
# published, and nothing imports it.
#
# Everything that ships or builds lives under `packages/`. A package opts in with
# `resolution: workspace` in its own pubspec; forgetting that marker is silent —
# the package simply gets its own resolution again.
#
# The Rust engine is deliberately *not* a Cargo workspace: there is exactly one
# crate (`packages/anycodec/rust`), and it stays that way. "One native artifact"
# is a product requirement, so splitting it into crates would only add seams.
name: anycodec_workspace
publish_to: none

environment:
  sdk: ^3.13.5

workspace:
  - packages/anycodec
  - packages/anycodec_video
  - packages/anycodec_audio

