include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # A browser-only compile probe: it names the web exports of
    # `anycodec_platform.dart`, which the VM analyzer cannot resolve because it
    # picks the `dart.io` branch of the conditional import. It is verified by
    # `dart compile js` instead — see the file's own comment.
    - test/web_compile_probe.dart
  errors:
    # `lib/src/bindings/anycodec_bindings_generated.dart` is generated by
    # ffigen, carries the `ignore_for_file` list from `ffigen.yaml`, and adds
    # one of its own, so `unused_import` is ignored twice there. Neither the
    # file nor the ffigen config is hand-editable, so the duplicate is silenced
    # here rather than being allowed to make `dart analyze` noisy for everyone.
    duplicate_ignore: ignore

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
