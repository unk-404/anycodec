name: anycodec_player
description: >-
  A demonstration player built only on anycodec, anycodec_video and
  anycodec_audio. It exists to show the three packages composing into playback
  and to measure it; it is not a general-purpose media player.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

resolution: workspace

dependencies:
  anycodec:
    path: ../anycodec
  anycodec_video:
    path: ../anycodec_video
  anycodec_audio:
    path: ../anycodec_audio
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true