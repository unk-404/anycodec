# Regenerate the Dart bindings after changing the C ABI:
#
#   cd rust
#   cbindgen --config cbindgen.toml --crate anycodec --output include/anycodec.h
#   cd ..
#   dart run ffigen --config ffigen.yaml
#
# `asset-id` must stay in sync with two other places:
#   * `_assetName` in `hook/build.dart`
#   * the location of this file inside `lib/`
# The three together are what `@ffi.Native` resolves at runtime.
name: AnycodecBindings
description: |
  Raw C bindings for `rust/include/anycodec.h`.

  This file is generated; do not edit it by hand. The hand-written API lives in
  `lib/anycodec.dart` and `lib/src/**`, on top of these bindings.
output: 'lib/src/bindings/anycodec_bindings_generated.dart'
headers:
  entry-points:
    - 'rust/include/anycodec.h'
  include-directives:
    - 'rust/include/anycodec.h'
ffi-native:
  asset-id: 'package:anycodec/src/bindings/anycodec_bindings_generated.dart'
comments:
  style: any
  length: full
preamble: |
  // AUTO GENERATED FILE, DO NOT EDIT.
  //
  // Generated by `package:ffigen` from `rust/include/anycodec.h`.
  // Regenerate with:
  //   dart run ffigen --config ffigen.yaml
  //
  // ignore_for_file: type=lint, unused_import, camel_case_types, non_constant_identifier_names
  // coverage:ignore-file
